apiVersion: v1
kind: ConfigMap
metadata:
  name: sftp-sshd-config
data:
  sshd_config: |
    Port 22
    Protocol 2
    HostKey /etc/ssh/ssh_host_rsa_key
    HostKey /etc/ssh/ssh_host_ed25519_key
    PermitRootLogin no
    PasswordAuthentication yes
    ChallengeResponseAuthentication no
    UsePAM no
    Subsystem sftp /usr/lib/openssh/sftp-server -f AUTH -l INFO
    LogLevel VERBOSE
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sftp-rsyslog-config
data:
  rsyslog.conf: |
    $ModLoad imuxsock
    $ModLoad imklog

    auth,authpriv.*    /var/log/sftp/sftp.log
    *.*;auth,authpriv.none   -/var/log/syslog
